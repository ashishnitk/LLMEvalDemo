[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-eval-demo"
version = "0.1.0"
description = "A local, evidence-first RAG evaluation workshop with DeepEval."
requires-python = ">=3.11"
dependencies = [
    "deepeval==3.9.9",
    "ollama==0.6.3",
    "streamlit==1.66.1",
    "scikit-learn==1.9.1",
    "httpx==0.28.1",
    "pydantic==2.14.2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2"]

[project.scripts]
rag-demo = "rag_demo.cli:main"

[tool.setuptools.packages.find]
include = ["rag_demo*"]

[tool.setuptools.package-data]
rag_demo = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-p no:deepeval"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "deepeval.*"]
ignore_missing_imports = true
